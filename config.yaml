# Configuratie voor de Zelda Switch 2 voorraad-monitor.
#
# Product-matching gebeurt op de titel/URL van een product (kleine letters).
# Een product telt mee als het:
#   - ALLE woorden uit "require_all" bevat,
#   - minstens één uit ELKE groep in "require_any" bevat,
#   - GEEN enkel woord uit "exclude" bevat.
match:
  require_all: ["zelda"]
  require_any:
    - ["switch 2", "switch-2", "switch2", "switch_2"]
    - ["40th", "anniversary", "40-jarig", "40 jarig", "jubileum", "40e", "40ste",
       "jubilaeum", "jubiläum", "40. jubil", "40-jahre", "40 jahre",
       "anniversaire", "40e anniv", "40ème"]
  exclude:
    - controller
    - amiibo
    - " tas"
    - "-tas"
    - draagtas
    - opbergtas
    - carrying
    - case
    - hoes
    - cover
    - protector
    - screenprotector
    - beschermer
    - joy-con
    - joycon
    - grip
    - lader
    - charging
    - standaard
    - poster
    - t-shirt
    - shirt
    - hoodie
    - mok
    - figuur
    - figure
    - lego
    - boek
    - guide
    - soundtrack
    - vinyl
    - tweedehands
    # Duits
    - tasche
    - hülle
    - huelle
    - schutzfolie
    - gebraucht
    # Frans
    - manette
    - housse
    - sacoche
    - étui
    - occasion
    - refurbished
    - gebruikt

# Links met deze stukjes in de URL worden genegeerd
# (Tweakers "aanbod" = tweedehands/particuliere verkoop, geen webshop).
exclude_url_parts:
  - /aanbod/
  - /vraag-en-aanbod/

# Maximale prijs in euro. Aanbod dat duurder is (doorverkopers/scalpers)
# geeft GEEN melding maar wordt in de log als "te duur" getoond.
# Adviesprijs is ca. €520-540. Zet op 0 om de grens uit te zetten.
max_price: 650

# Zoektermen die op elke webshop worden ingevuld in {q}.
search_terms:
  - "switch 2 zelda"
  - "zelda 40th anniversary"

# Hoeveel kandidaat-productpagina's per webshop maximaal bekeken worden.
max_candidates_per_shop: 6

# Directe productpagina's die altijd gecontroleerd worden (voeg gerust toe
# zodra je een productpagina vindt).
product_urls:
  - https://www.coolblue.nl/product/986118/nintendo-switch-2-the-legend-of-zelda-40th-anniversary-edition.html
  - https://www.coolblue.be/nl/product/986118/nintendo-switch-2-the-legend-of-zelda-40th-anniversary-edition.html
  - https://www.coolblue.de/produkt/986118/nintendo-switch-2-the-legend-of-zelda-edition-zum-40-jubilaeum.html

# Vroege signalen (melding met prioriteit "hoog"):
#  - een shop meldt "binnenkort weer leverbaar" / "demnächst verfügbar" e.d.
#  - er duikt een nieuwe productpagina op bij een shop die we al volgden
early_signals:
  enabled: true

# Sociale media: tips van andere mensen ("weer op voorraad bij ...").
# Een tip geeft een melding met prioriteit "hoog" (de webshop-melding is "urgent").
social:
  enabled: true
  sources: [pepper, reddit, bluesky]
  queries:
    - "zelda switch 2"
    - "switch 2 zelda voorraad"
  max_age_hours: 48             # oudere posts negeren
  max_notifications_per_run: 3  # niet meer dan 3 tips per run
  # Post moet over de console gaan:
  require_all: ["zelda"]
  require_any:
    - ["switch 2", "switch2", "switch-2"]
    - ["voorraad", "restock", "in stock", "back in stock", "beschikbaar", "leverbaar",
       "bestelbaar", "te koop", "weer", "nu bij", "drop", "deal", "aanbieding", "€"]
  exclude: ["pro controller", "amiibo", "wtb", "gezocht", "ruilen"]
  # Voor Reddit en Bluesky (wereldwijd) moet de post ook over Nederland gaan:
  nl_words: [".nl", "coolblue", "bol.com", "bol ", "mediamarkt", "nedgame", "game mania",
             "gamemania", "intertoys", "amazon.nl", "wehkamp", "alternate", "tweakers",
             "nederland", "netherlands", "dutch", "holland", " nl ", "(nl)", "[nl]",
             "r/thenetherlands", "r/nederland", "belgi"]

# Webshops met hun zoek-URL. {q} wordt vervangen door de zoekterm.
#   country      : NL / DE / BE (vlag in log en melding)
#   ships_to_nl  : true / false / null (= onbekend) - verzendt de shop naar NL?
#   shipping_nl  : indicatie verzendkosten naar NL in euro (opgeteld bij de prijs
#                  voor de prijsgrens)
#   note         : extra toelichting in de melding
# Zet "enabled: false" om een shop over te slaan.
shops:
  # ---------------------------------------------------------------- Nederland
  - name: Coolblue
    search: https://www.coolblue.nl/zoeken?query={q}
  - name: bol.com
    search: https://www.bol.com/nl/nl/s/?searchtext={q}
  - name: MediaMarkt
    search: https://www.mediamarkt.nl/nl/search.html?query={q}
  - name: Amazon.nl
    search: https://www.amazon.nl/s?k={q}
  - name: Nintendo Store
    search: https://www.nintendo.com/nl-nl/Zoeken/Zoeken-299117.html?q={q}
  - name: Intertoys
    search: https://www.intertoys.nl/search?q={q}
  - name: Game Mania
    search: https://www.gamemania.nl/search?q={q}
  - name: Nedgame
    search: https://www.nedgame.nl/zoeken/?zoek={q}
  - name: Wehkamp
    search: https://www.wehkamp.nl/zoeken/?term={q}
  - name: Blokker
    enabled: false  # zoekpagina gaf 404
    search: https://www.blokker.nl/zoeken?q={q}
  - name: Expert
    enabled: false  # zoekpagina gaf 404
    search: https://www.expert.nl/zoeken?q={q}
  - name: EP
    search: https://www.ep.nl/zoeken/?q={q}
  - name: Alternate
    search: https://www.alternate.nl/listing.xhtml?q={q}
  - name: Tweakers Pricewatch
    search: https://tweakers.net/zoeken/?keyword={q}

  # ---------------------------------------------------------------- Duitsland
  - name: Amazon.de
    country: DE
    ships_to_nl: true
    shipping_nl: 7
    note: "Amazon.de levert meestal naar NL; controleer bij de verkoper"
    search: https://www.amazon.de/s?k={q}
  - name: MediaMarkt.de
    country: DE
    ships_to_nl: false
    note: "alleen Duits adres"
    search: https://www.mediamarkt.de/de/search.html?query={q}
  - name: Saturn.de
    country: DE
    ships_to_nl: false
    note: "alleen Duits adres"
    search: https://www.saturn.de/de/search.html?query={q}
  - name: Otto.de
    country: DE
    ships_to_nl: false
    note: "alleen Duits adres"
    search: https://www.otto.de/suche/{q}/
  - name: Coolblue.de
    country: DE
    ships_to_nl: false
    note: "alleen Duits adres"
    search: https://www.coolblue.de/suche?query={q}
  - name: Galaxus.de
    country: DE
    ships_to_nl: null
    search: https://www.galaxus.de/de/search?q={q}
  - name: Alternate.de
    country: DE
    ships_to_nl: false
    note: "NL-klanten via alternate.nl"
    search: https://www.alternate.de/listing.xhtml?q={q}
  - name: Müller
    country: DE
    ships_to_nl: false
    note: "alleen Duits adres"
    search: https://www.mueller.de/search/?q={q}
  - name: Smyths Toys DE
    country: DE
    ships_to_nl: false
    note: "alleen Duits adres"
    search: https://www.smythstoys.com/de/de-de/search?text={q}
  - name: GameStop.de
    country: DE
    ships_to_nl: false
    note: "alleen Duits adres"
    search: https://www.gamestop.de/SearchResult/QuickSearch?q={q}
  - name: Geizhals.de
    country: DE
    ships_to_nl: null
    note: "prijsvergelijker; verzending verschilt per shop"
    search: https://geizhals.de/?fs={q}

  # ---------------------------------------------------------------- België
  - name: Coolblue.be
    country: BE
    ships_to_nl: false
    note: "alleen Belgisch adres; afhalen in een Belgische winkel kan"
    search: https://www.coolblue.be/nl/zoeken?query={q}
  - name: MediaMarkt.be
    country: BE
    ships_to_nl: false
    note: "alleen Belgisch adres; afhalen in BE kan"
    search: https://www.mediamarkt.be/nl/search.html?query={q}
  - name: Amazon.com.be
    country: BE
    ships_to_nl: null
    search: https://www.amazon.com.be/s?k={q}
  - name: Fnac.be
    country: BE
