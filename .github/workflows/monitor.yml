name: Zelda Switch 2 monitor

on:
  schedule:
    # 4x per dag. GitHub gebruikt UTC: 07/11/15/19 UTC = 08/12/16/20 uur NL-wintertijd
    # (in de zomertijd een uur later). Minuut 17 i.p.v. :00 omdat GitHub op het hele
    # uur druk is en runs dan vertraagd raken.
    - cron: "17 7,11,15,19 * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Alleen een testmelding sturen"
        type: boolean
        default: false

permissions:
  contents: write   # state.json terugschrijven
  issues: write     # GitHub-issue als extra melding

concurrency:
  group: zelda-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testmelding
        if: ${{ inputs.test_notify }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ISSUE_ALERTS: "false"
        run: python monitor.py --test-notify

      - name: Webshops controleren
        if: ${{ !inputs.test_notify }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ISSUE_ALERTS: ${{ vars.GITHUB_ISSUE_ALERTS || 'true' }}
        run: python monitor.py --verbose

      - name: Status opslaan
        if: ${{ !inputs.test_notify }}
        run: |
          git config user.name "zelda-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "Geen statuswijziging."
            exit 0
          fi
          git commit -m "Update voorraadstatus [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            sleep $((i * 5))
          done
