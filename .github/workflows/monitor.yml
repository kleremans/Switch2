name: Zelda Switch 2 monitor

on:
  schedule:
    # 8x per dag tussen 07:00 en 23:00 Nederlandse tijd: 08:17, 10:17, ... 22:17.
    # GitHub rekent in UTC en kent geen zomer-/wintertijd, daarom start de cron elk
    # uur tussen 06 en 21 UTC en laat de stap "Tijdvenster" alleen de juiste
    # Nederlandse uren door. Minuut 17 omdat GitHub op het hele uur druk is.
    - cron: "17 6-21 * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Alleen een testmelding sturen"
        type: boolean
        default: false

permissions:
  contents: write   # state.json terugschrijven
  issues: write     # GitHub-issue als extra melding

concurrency:
  group: zelda-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Tijdvenster (NL-tijd)
        id: window
        run: |
          hour=$(TZ=Europe/Amsterdam date +%H)
          echo "Nederlandse tijd: $(TZ=Europe/Amsterdam date '+%H:%M')"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            case "$hour" in
              08|10|12|14|16|18|20|22) echo "run=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "Buiten het schema, overslaan."; echo "run=false" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.window.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.window.outputs.run == 'true'

      - name: Testmelding
        if: ${{ steps.window.outputs.run == 'true' && inputs.test_notify }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ISSUE_ALERTS: "false"
        run: python monitor.py --test-notify

      - name: Webshops controleren
        if: ${{ steps.window.outputs.run == 'true' && !inputs.test_notify }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ISSUE_ALERTS: ${{ vars.GITHUB_ISSUE_ALERTS || 'true' }}
        run: python monitor.py --verbose

      - name: Status opslaan
        if: ${{ steps.window.outputs.run == 'true' && !inputs.test_notify }}
        run: |
          git config user.name "zelda-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "Geen statuswijziging."
            exit 0
          fi
          git commit -m "Update voorraadstatus [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            sleep $((i * 5))
          done
